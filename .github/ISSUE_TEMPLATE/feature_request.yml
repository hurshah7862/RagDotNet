name: Feature request
description: Suggest something RagDotNet should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task or situation, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How you picture it working, for example the API you would call.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you have tried
