# Publishes every package to nuget.org when a v* tag is pushed (git tag v1.2.3 && git push origin v1.2.3).
# Before the first tag, set up nuget.org trusted publishing and the NUGET_USER repository variable: see docs/publishing.md.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Test, pack and publish to nuget.org
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Add required reviewers to this environment in the repository settings to approve each release by hand.
    environment: nuget
    permissions:
      contents: read
      id-token: write # trusted publishing: nuget.org exchanges this job's OIDC token for a short-lived API key
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      RAGDOTNET_TESSDATA: /usr/share/tesseract-ocr/5/tessdata
    steps:
      # Full history: MinVer needs the tag and its history to version the packages.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A published version can never be replaced, so only commits already on main are published.
      - name: Check the tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Tag $GITHUB_REF_NAME is on a commit that is not on main; only commits on main are published."
            exit 1
          }

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The same unit tests as the CI workflow's Linux jobs, on both net8.0 and net10.0: without --framework,
      # dotnet test runs every target framework of the project.
      - name: Test Core (net8.0, net10.0)
        run: dotnet test --project tests/RagDotNet.Core.Tests --no-build --configuration Release

      - name: Test readers (net8.0, net10.0)
        run: dotnet test --project tests/RagDotNet.Readers.Tests --no-build --configuration Release

      - name: Test OCR (net8.0, net10.0)
        run: dotnet test --project tests/RagDotNet.Ocr.Tests --no-build --configuration Release

      - name: Test Lucene keyword index (net8.0, net10.0)
        run: dotnet test --project tests/RagDotNet.Keyword.Lucene.Tests --no-build --configuration Release

      - name: Test hosting (net8.0, net10.0)
        run: dotnet test --project tests/RagDotNet.Hosting.Tests --no-build --configuration Release

      - name: Test DataIngestion adapters (net8.0, net10.0)
        run: dotnet test --project tests/RagDotNet.DataIngestion.Tests --no-build --configuration Release

      - name: Test SQLite connector (net8.0, net10.0)
        run: dotnet test --project tests/RagDotNet.VectorData.Sqlite.Tests --no-build --configuration Release

      - name: Test store suite on SQLite (net8.0, net10.0)
        env:
          RAGDOTNET_STORES_REQUIRED: 1
        run: dotnet test --project tests/RagDotNet.StoreTests --no-build --configuration Release --filter-class "RagDotNet.StoreTests.Stores.Sqlite*" --minimum-expected-tests 78

      # The evaluation harness targets net10.0 only; its tests use a fake Ollama server, so they need no model.
      - name: Test evaluation harness (net10.0)
        run: dotnet test --project tests/RagDotNet.Evaluation.Tests --no-build --configuration Release

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output artifacts/packages

      # Fails before anything is pushed if the packages are not versioned from this tag (v1.2.3 -> 1.2.3).
      - name: Check packages
        run: dotnet run eng/check-packages.cs -- artifacts/packages --version "${GITHUB_REF_NAME#v}"

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # --skip-duplicate makes a re-run after a partial push safe: versions already on nuget.org are skipped instead of
      # failing the job. Symbols go in their own step, because the client pushes a package's .snupkg only when it pushed
      # the .nupkg itself, so a re-run would otherwise never send the symbols of a package it skipped.
      - name: Push packages to nuget.org
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --no-symbols
          --skip-duplicate

      - name: Push symbols to nuget.org
        run: >-
          dotnet nuget push "artifacts/packages/*.snupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
