name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests (net8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      # The SDK comes from global.json; the 8.0 runtime is needed to run the net8.0 tests.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Unit tests only: they need no model, network or Docker.
      - name: Test Core (net8.0)
        run: dotnet test --project tests/RagDotNet.Core.Tests --no-build --configuration Release --framework net8.0

      - name: Test readers (net8.0)
        run: dotnet test --project tests/RagDotNet.Readers.Tests --no-build --configuration Release --framework net8.0
