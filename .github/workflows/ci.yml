name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests (net8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # The OCR tests read English with the distribution's Tesseract; on CI they fail rather than skip without it.
      RAGDOTNET_TESSDATA: /usr/share/tesseract-ocr/5/tessdata
    steps:
      - uses: actions/checkout@v4

      # The SDK comes from global.json; the 8.0 runtime is needed to run the net8.0 tests.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Unit tests only: they need no model, network or Docker.
      - name: Test Core (net8.0)
        run: dotnet test --project tests/RagDotNet.Core.Tests --no-build --configuration Release --framework net8.0

      - name: Test readers (net8.0)
        run: dotnet test --project tests/RagDotNet.Readers.Tests --no-build --configuration Release --framework net8.0

      - name: Test OCR (net8.0)
        run: dotnet test --project tests/RagDotNet.Ocr.Tests --no-build --configuration Release --framework net8.0

      - name: Test Lucene keyword index (net8.0)
        run: dotnet test --project tests/RagDotNet.Keyword.Lucene.Tests --no-build --configuration Release --framework net8.0

      - name: Test hosting (net8.0)
        run: dotnet test --project tests/RagDotNet.Hosting.Tests --no-build --configuration Release --framework net8.0

      - name: Test SQLite connector (net8.0)
        run: dotnet test --project tests/RagDotNet.VectorData.Sqlite.Tests --no-build --configuration Release --framework net8.0

  store-tests:
    name: Store integration tests (net8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      RAGDOTNET_INTEGRATION: 1
      # A store that cannot start fails the run instead of skipping.
      RAGDOTNET_STORES_REQUIRED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build tests/RagDotNet.StoreTests --configuration Release

      # The floor fails the run if tests go missing; raise it whenever a slice adds a store, a binding or a test.
      # The floor counts tests that run, not skipped ones. Today: 3 gate tests + 8 container tests (the 4 integration-off
      # checks skip here) + 39 suite tests x 11 bindings (InMemory String/Guid, NativeHybridFake String, SQLite String/Guid,
      # PgVector String/Guid, Qdrant Guid, Redis String/Guid, SqlServer Guid) + 1 Qdrant settings test + 2 SQL Server
      # settings tests. PgVector, Qdrant, Redis and SQL Server each start one container through Testcontainers; the SQL
      # Server image (the pinned 2025 image plus Full-Text Search) is built in the job, which takes a few minutes.
      - name: Test stores (net8.0)
        run: dotnet test --project tests/RagDotNet.StoreTests --no-build --configuration Release --framework net8.0 --minimum-expected-tests 443

  windows:
    name: Windows unit and OCR tests (net8.0)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      # Tesseract itself is included in the package on Windows; only the language data is downloaded.
      - name: Download English language data
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'tessdata'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata -OutFile (Join-Path $dir 'eng.traineddata')
          "RAGDOTNET_TESSDATA=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test Core (net8.0)
        run: dotnet test --project tests/RagDotNet.Core.Tests --no-build --configuration Release --framework net8.0

      - name: Test readers (net8.0)
        run: dotnet test --project tests/RagDotNet.Readers.Tests --no-build --configuration Release --framework net8.0

      - name: Test OCR (net8.0)
        run: dotnet test --project tests/RagDotNet.Ocr.Tests --no-build --configuration Release --framework net8.0

      - name: Test Lucene keyword index (net8.0)
        run: dotnet test --project tests/RagDotNet.Keyword.Lucene.Tests --no-build --configuration Release --framework net8.0

      - name: Test hosting (net8.0)
        run: dotnet test --project tests/RagDotNet.Hosting.Tests --no-build --configuration Release --framework net8.0

      - name: Test SQLite connector (net8.0)
        run: dotnet test --project tests/RagDotNet.VectorData.Sqlite.Tests --no-build --configuration Release --framework net8.0

      # SQLite needs no service, so the suite runs here too, on the win-x64 sqlite-vec native.
      - name: Test store suite on SQLite (net8.0)
        env:
          RAGDOTNET_STORES_REQUIRED: 1
        run: dotnet test --project tests/RagDotNet.StoreTests --no-build --configuration Release --framework net8.0 --filter-class "RagDotNet.StoreTests.Stores.Sqlite*" --minimum-expected-tests 78

  macos:
    name: macOS SQLite tests (net8.0)
    # The only job that loads the osx-arm64 sqlite-vec native (macos-latest is Apple Silicon).
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Build
        run: |
          dotnet build tests/RagDotNet.VectorData.Sqlite.Tests --configuration Release
          dotnet build tests/RagDotNet.StoreTests --configuration Release

      - name: Test SQLite connector (net8.0)
        run: dotnet test --project tests/RagDotNet.VectorData.Sqlite.Tests --no-build --configuration Release --framework net8.0

      - name: Test store suite on SQLite (net8.0)
        env:
          RAGDOTNET_STORES_REQUIRED: 1
        run: dotnet test --project tests/RagDotNet.StoreTests --no-build --configuration Release --framework net8.0 --filter-class "RagDotNet.StoreTests.Stores.Sqlite*" --minimum-expected-tests 78
